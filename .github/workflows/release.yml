name: Build and release

# Two ways to release:
#  - Push a tag such as v1.2.0: runs the build and publishes a GitHub Release for that tag.
#  - Run it by hand with "publish" ticked: creates the tag v<version> and the release on main,
#    without cloning or pushing anything from your computer.
# Run it by hand without "publish" to get a test build as a downloadable artifact.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.0. Must match manifest.json on main when publishing.'
        required: false
        default: ''
      publish:
        description: 'Create the tag and GitHub Release from this run (run from main).'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned so a runner-image migration doesn't change the build environment
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Unit tests
        run: node tests/unit.mjs

      - name: Syntax check
        run: |
          for f in background.js popup.js options.js src/*.js; do
            node --check --input-type=module < "$f" || { echo "Syntax error in $f"; exit 1; }
          done

      - name: Work out version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$INPUT_VERSION"
          fi
          if [ -z "$V" ]; then echo "No version given."; exit 1; fi

          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$PUBLISH" = "true" ]; then
            M=$(node -p "require('./manifest.json').version")
            if [ "$M" != "$V" ]; then
              echo "Version is $V but manifest.json says $M. Update manifest.json on main, commit, and try again."
              exit 1
            fi
          fi

          if [ "$PUBLISH" = "true" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "Publishing only works from main. Re-run with Branch set to main."; exit 1
            fi
            if gh release view "v$V" > /dev/null 2>&1; then
              echo "A release v$V already exists."; exit 1
            fi
          fi

          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Stage extension
        run: node scripts/build.mjs "$VERSION"

      - name: Package store zip
        run: |
          V=$(node -p "require('./dist/worklog-timer/manifest.json').version")
          ARCHIVE="worklog-timer-$V.zip"
          # manifest.json must sit at the root of the zip, which is what the Chrome Web Store expects
          (cd dist/worklog-timer && zip -qr "../$ARCHIVE" .)
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Built dist/$ARCHIVE"
          unzip -l "dist/$ARCHIVE" | head -20

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARCHIVE }}
          path: dist/${{ env.ARCHIVE }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          # --target creates the tag at this run's commit (main) when it doesn't exist yet
          gh release create "$TAG" "dist/$ARCHIVE" \
            --target "$GITHUB_SHA" --title "Worklog Timer $TAG" --generate-notes
